<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شەترەنجی شاهانە | یاری کوردی</title>
    
    <!-- فۆنت، ئایکۆن، Tailwind و Phaser 3 -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <style>
        :root {
            --bg-dark: #05030f;
            --gold: #ffb800;
            --gold-gradient: linear-gradient(135deg, #ffd000 0%, #ff8800 100%);
            --card-bg: rgba(18, 12, 42, 0.88);
            --text-main: #ffffff;
            --text-muted: #a49ec8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, rgba(5, 3, 15, 0.72), rgba(5, 3, 15, 0.96)), 
                        url('images.png/background.png') no-repeat center top / cover fixed;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* بەشی سەرەوە */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:active { transform: scale(0.95); }

        .game-badge {
            background: rgba(255, 184, 0, 0.18);
            border: 1px solid rgba(255, 184, 0, 0.5);
            color: var(--gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
        }

        /* پانێڵی ئامادەکاری پێش یاری */
        .setup-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(168, 85, 247, 0.45);
            border-radius: 26px;
            padding: 24px 20px;
            margin-top: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .gold-btn {
            background: var(--gold-gradient);
            color: #1a0f00;
            font-weight: 900;
            border-radius: 18px;
            padding: 14px;
            width: 100%;
            border: none;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 184, 0, 0.4);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gold-btn:active { transform: scale(0.97); }

        /* پانێڵی یاریزانەکان */
        .player-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .clock-box {
            background: #0a061c;
            border: 1.5px solid rgba(255, 184, 0, 0.45);
            color: var(--gold);
            font-family: monospace;
            font-size: 17px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 12px;
            letter-spacing: 1px;
        }

        /* چوارچێوەی تەختەی شەترەنج */
        .board-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 452px;
            margin: 8px auto;
            border-radius: 20px;
            padding: 5px;
            background: linear-gradient(135deg, #ffd000, #a855f7, #00f0ff);
            box-shadow: 0 12px 35px rgba(138, 43, 226, 0.35);
        }

        #boardWrapper {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #120d29;
        }

        #chessBoard canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* مۆداڵی کۆتایی یاری */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 3, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-box {
            background: #160f36;
            border: 2px solid var(--gold);
            border-radius: 26px;
            padding: 28px 22px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- بەشی سەرەوە -->
        <header class="top-bar">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i>
                <span>سەرەکی</span>
            </a>
            <div class="game-badge">شەترەنجی شاهانە ♔</div>
            <button onclick="clearArrows()" class="back-btn" style="padding: 8px 12px;" title="سڕینەوەی سەهمەکان">
                <i class="fa-solid fa-eraser text-yellow-400"></i>
            </button>
        </header>

        <!-- ١. پانێڵی هەڵبژاردنی کات و ئاست پێش دەستپێکردن -->
        <div id="chessSetupPanel" class="setup-card">
            <div class="text-center mb-5">
                <div class="w-16 h-16 mx-auto mb-3 rounded-2xl flex items-center justify-center text-3xl" style="background: var(--gold-gradient); color: #1a0f00;">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h2 class="text-xl font-black text-white">ئامادەکاری یاری شەترەنج</h2>
                <p class="text-xs text-slate-300 mt-1">کاتی یاری و ئاستی زیرەکی هەڵبژێرە</p>
            </div>

            <!-- هەڵبژاردنی کات -->
            <label class="block text-xs font-bold text-yellow-400 mb-2">⏱️ کاتی یاری (خولەک):</label>
            <div class="grid grid-cols-3 gap-2 mb-5">
                <button type="button" onclick="selectTime(60, 0, this)" class="time-btn py-2.5 rounded-xl text-xs font-extrabold bg-[#0d1933] text-slate-300 border border-white/10 transition">
                    ⚡ 1 خولەک
                </button>
                <button type="button" onclick="selectTime(180, 0, this)" class="time-btn py-2.5 rounded-xl text-xs font-extrabold bg-yellow-500 text-[#050b18] border border-yellow-400 transition">
                    🔥 3 خولەک
                </button>
                <button type="button" onclick="selectTime(600, 0, this)" class="time-btn py-2.5 rounded-xl text-xs font-extrabold bg-[#0d1933] text-slate-300 border border-white/10 transition">
                    👑 10 خولەک
                </button>
            </div>

            <!-- ئاستی بۆت -->
            <label class="block text-xs font-bold text-purple-300 mb-2">🤖 ئاستی زیرەکی بەرامبەر:</label>
            <select id="botLevelSelect" class="w-full bg-[#0d1933] text-white text-sm font-bold p-3 rounded-xl border border-purple-500/40 mb-6 outline-none">
                <option value="1">ئاستی سەرەتایی (ئاسان)</option>
                <option value="2" selected>ئاستی مامناوەند (پڕۆفیشناڵ)</option>
                <option value="3">ئاستی مامۆستا (زۆر بەهێز)</option>
            </select>

            <!-- دوگمەی دەستپێکردن -->
            <button onclick="startBotGame()" class="gold-btn">
                <i class="fa-solid fa-play"></i>
                <span>دەستپێکردنی یاری</span>
            </button>
        </div>

        <!-- ٢. گۆڕەپانی چالاکی یارییەکە -->
        <div id="activeGameArea" class="hidden flex-1 flex flex-col justify-between">
            <!-- یاریزانی بەرامبەر -->
            <div class="player-bar">
                <div class="flex items-center gap-2.5">
                    <div id="oppAvatar" class="w-10 h-10 rounded-xl bg-purple-900/60 border border-purple-400/50 flex items-center justify-center text-lg">🤖</div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span id="oppName" class="text-sm font-extrabold">بۆتی YariKurdi</span>
                            <span id="oppEloBadge" class="text-[11px] text-yellow-400 font-bold">(1300)</span>
                        </div>
                        <span id="turnIndicator" class="text-xs font-bold text-yellow-300">نۆرەی سپییە</span>
                    </div>
                </div>
                <div id="oppClock" class="clock-box">03:00</div>
            </div>

            <!-- تەختەی شەترەنج -->
            <div class="board-frame">
                <div id="boardWrapper">
                    <div id="chessBoard"></div>
                </div>
            </div>

            <!-- یاریزانی خۆت -->
            <div class="player-bar">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg font-black" style="background: var(--gold-gradient); color: #1a0f00;">♔</div>
                    <div>
                        <div class="text-sm font-extrabold">تۆ (یاری کوردی)</div>
                        <div class="text-[11px] text-slate-400">داشە سپییەکان</div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div id="selfClock" class="clock-box">03:00</div>
                    <button onclick="resignGame()" class="bg-red-500/20 border border-red-500/50 text-red-300 px-3 py-2 rounded-xl text-xs font-bold" title="خۆبەدەستەوەدان">
                        <i class="fa-solid fa-flag"></i>
                    </button>
                </div>
            </div>

            <!-- مێژووی جووڵەکان -->
            <div id="moveHistoryBox" class="mt-2 bg-[#0d091e]/90 border border-white/10 rounded-xl p-2 text-xs overflow-x-auto whitespace-nowrap min-h-[34px]"></div>
        </div>
    </div>

    <!-- پەنجەرەی کۆتایی یاری -->
    <div id="gameOverModal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div id="modalIcon" class="text-5xl mb-3">🏆</div>
            <h3 id="modalTitle" class="text-2xl font-black text-yellow-400 mb-1">سەرکەوتن!</h3>
            <p id="modalSubtitle" class="text-sm text-slate-300 mb-4">کش و مات! تۆ یارییەکەت بردەوە</p>
            <div id="eloChangeBox" class="hidden bg-white/5 rounded-xl p-2 mb-4 text-xs font-bold text-emerald-400">
                <span id="eloChangeText"></span>
            </div>
            <button onclick="closeGameOverModal()" class="gold-btn">
                <i class="fa-solid fa-rotate-right"></i>
                <span>یارییەکی نوێ</span>
            </button>
        </div>
    </div>

    <!-- دەنگە کاریگەرەکانی شەترەنج + مەکینەی یارییەکە -->
    <script>
        function playChessSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type === 'check' ? 'sawtooth' : 'sine';
                osc.frequency.setValueAtTime(type === 'capture' ? 280 : (type === 'check' ? 540 : 420), now);
                osc.frequency.exponentialRampToValueAtTime(type === 'capture' ? 120 : 210, now + 0.08);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.1);
            } catch (e) {}
        }
       function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
    <script src="chess-engine.js"></script>
</body>
</html>
