<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لودۆی شاهانە 120FPS | یاری کوردی</title>
    
    <!-- فۆنت، ئایکۆن و مەکینەی PixiJS v7 (120FPS) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>

    <style>
        :root {
            --bg-dark: #05030f;
            --gold: #ffb800;
            --gold-gradient: linear-gradient(135deg, #ffd000 0%, #ff8800 100%);
            --card-bg: rgba(18, 12, 42, 0.88);
            --text-main: #ffffff;
            --text-muted: #a49ec8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, rgba(5, 3, 15, 0.72), rgba(5, 3, 15, 0.96)), 
                        url('images.png/background.png') no-repeat center top / cover fixed;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
/* شریتی پڕبوونی ئاست (XP Bar) ڕێک لە ناو چوارچێوە شینەکەی تەنیشت ئەستێرەکە */
        .hud-xp-fill {
            position: absolute;
            top: 2.38%;
            left: 23.2%;
            width: 19.6%;
            height: 1.55%;
            background: rgba(15, 23, 42, 0.45);
            border-radius: 999px;
            overflow: hidden;
            z-index: 20;
            pointer-events: none;
        }

        .hud-xp-fill-bar {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, #fde047, #f59e0b);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* ئەڤاتاری یاریزان ڕێک لە ناوەڕاستی بازنە زێڕینەکە */
        .hud-avatar-overlay {
            position: absolute;
            top: 1.05%;
            left: 2.8%;
            width: 11.4%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            overflow: hidden;
            z-index: 20;
            cursor: pointer;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
        }

        .hud-avatar-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ژمارەی ئاست ڕێک لە ناو ئەستێرە زەردەکە */
        .hud-level-overlay {
            position: absolute;
            top: 2.15%;
            left: 17.5%;
            width: 4.8%;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            color: #451a03;
            z-index: 22;
            pointer-events: none;
        }

        /* ژمارەی گۆڵد و ئەڵماس لە ناوەڕاستی بۆکسە شینەکاندا */
        .hud-gold-val {
            position: absolute;
            top: 2.05%;
            left: 50.5%;
            width: 14%;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            z-index: 21;
            pointer-events: none;
            white-space: nowrap;
        }

        .hud-diamond-val {
            position: absolute;
            top: 2.05%;
            left: 78.2%;
            width: 13.5%;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            z-index: 21;
            pointer-events: none;
            white-space: nowrap;
        }
        /* دوگمە نادیارەکانی سەر + گۆڵد و + ئەڵماس */
        .hud-plus-hitbox {
            position: absolute;
            top: 1.5%;
            width: 6.5%;
            height: 3.8%;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 22;
        }

        /* ٥ دوگمە نادیارەکەی سەر کارتەکانی ناوەڕاستی وێنەکە */
        .hotspot-card {
            position: absolute;
            background: transparent;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .hotspot-card:active {
            transform: scale(0.95);
            box-shadow: inset 0 0 26px rgba(255, 255, 255, 0.45), 0 0 24px rgba(255, 208, 0, 0.75);
        }

        /* ٥ دوگمە نادیارەکەی سەر شریتی خوارەوەی وێنەکە */
        .dock-hotspot {
            position: absolute;
            bottom: 0.5%;
            height: 12.5%;
            background: transparent;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.12s ease;
        }

        .dock-hotspot:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        /* پەنجەرەی هەڵبژاردنی مۆد */
        .sub-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(3, 18, 45, 0.84);
            backdrop-filter: blur(10px);
            z-index: 6000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .sub-modal-card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(160deg, #102a6b 0%, #071336 100%);
            border: 2px solid #ffd000;
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .mode-choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0;
        }

        .mode-choice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 208, 0, 0.45);
            border-radius: 18px;
            padding: 14px 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s;
        }

        .mode-choice-btn:active { transform: scale(0.95); }
        .mode-choice-btn.active {
            background: rgba(255, 208, 0, 0.22);
            border-color: #ffd000;
            box-shadow: 0 0 18px rgba(255, 208, 0, 0.35);
        }

        /* =========================================================
           ستایلی تەختەی یاریکردن (Game Wrapper)
           ========================================================= */
        .game-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100dvh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.95); }

        .online-top-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: 1.5px solid #a7f3d0;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transition: transform 0.15s;
        }

        .online-top-btn:active { transform: scale(0.95); }

        .restart-btn {
            background: rgba(255, 184, 0, 0.15);
            border: 1px solid rgba(255, 184, 0, 0.45);
            color: var(--gold);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .restart-btn:active { transform: scale(0.92); }

        .player-panel {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1.8px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .panel-active-turn {
            border-color: #fde047 !important;
            box-shadow: 0 0 24px rgba(250, 204, 21, 0.35) !important;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .avatar-box {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: 900;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-red {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border: 2px solid #fca5a5;
            color: #fff;
        }

        .avatar-yellow {
            background: var(--gold-gradient);
            color: #1a0f00;
            border: 2px solid #fef08a;
        }

        .p-name {
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
        }

        .p-crowns {
            font-size: 12px;
            font-weight: 700;
            color: #fde047;
            margin-top: 2px;
        }

        .speech-bubble {
            position: absolute;
            left: 78px;
            top: -14px;
            background: #ffffff;
            color: #0f172a;
            font-size: 12px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.55);
            border: 2px solid var(--gold);
            opacity: 0;
            transform: translateY(8px) scale(0.85);
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 40;
            white-space: nowrap;
        }

        .speech-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .dice-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-pill {
            font-family: monospace;
            font-size: 13px;
            font-weight: 900;
            color: #fde047;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 4px 8px;
            border-radius: 10px;
            min-width: 36px;
            text-align: center;
        }

        .dice-container {
            position: relative;
            width: 54px;
            height: 54px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border-radius: 16px;
            border: 2.5px solid var(--gold);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55), inset 0 2px 4px rgba(255,255,255,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            color: #0f172a;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .dice-container:active { transform: scale(0.9); }

        .dice-ready-glow {
            box-shadow: 0 0 22px rgba(250, 204, 21, 0.9), 0 6px 16px rgba(0, 0, 0, 0.55) !important;
        }

        @keyframes diceSpin3D {
            0%   { transform: rotate(0deg) scale(1); }
            35%  { transform: rotate(140deg) scale(1.22); }
            70%  { transform: rotate(260deg) scale(1.12); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .dice-rolling {
            animation: diceSpin3D 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes bounceArrow {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -7px); }
        }
        .animate-bounce { animation: bounceArrow 0.75s infinite; }

        .status-bar {
            text-align: center;
            margin: 5px 0;
        }

        .turn-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.55);
            color: #f3e8ff;
            font-size: 12px;
            font-weight: 800;
            padding: 3px 14px;
            border-radius: 20px;
            margin-bottom: 3px;
        }

        .status-text {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold);
        }

        .board-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 444px;
            margin: 0 auto;
            border-radius: 22px;
            padding: 6px;
            background: linear-gradient(135deg, #ffd000, #a855f7, #00f0ff);
            box-shadow: 0 14px 38px rgba(138, 43, 226, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ludoBoard {
            width: 100%;
            height: 100%;
            border-radius: 17px;
            overflow: hidden;
            background: #fffdf7;
            touch-action: none;
            position: relative;
        }

        #ludoBoard canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .reactions-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .react-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }

        .react-btn:active {
            transform: scale(0.88);
            background: rgba(255, 184, 0, 0.28);
        }

        .win-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 3, 15, 0.86);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .win-modal-card {
            width: 100%;
            max-width: 360px;
            background: #160f36;
            border: 2px solid var(--gold);
            border-radius: 26px;
            padding: 26px 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85);
        }

        .win-btn {
            background: var(--gold-gradient);
            color: #1a0f00;
            font-weight: 900;
            font-size: 15px;
            border: none;
            border-radius: 16px;
            padding: 13px;
            width: 100%;
            cursor: pointer;
            margin-top: 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- =========================================================
         قۆناغی ١: لۆبیی شاهانەی لۆدۆ (Yari Kurdi Royal Lobby)
         ========================================================= -->
    <section id="ludoRoyalLobby" class="ludo-lobby-screen">
        <div class="lobby-stage">
            <div class="hud-xp-fill"><div id="lobbyXpBar" class="hud-xp-fill-bar"></div></div>
            <!-- پڕۆفایل، ئاست، گۆڵد و ئەڵماس لەسەر شریتی سەرەوەی وێنەکە -->
            <div class="hud-avatar-overlay" onclick="window.location.href='profile.html'" title="پڕۆفایل">
                <img id="lobbyPlayerAvatar" src="images.png/controller.png" alt="">
            </div>
            <div id="lobbyPlayerLevel" class="hud-level-overlay">1</div>

            <div id="lobbyGoldTxt" class="hud-gold-val" data-wallet-gold>0</div>
            <button class="hud-plus-hitbox" style="left: 64.5%;" onclick="if(window.YariWallet) YariWallet.openStore('gold')" aria-label="زیادکردنی گۆڵد"></button>

            <div id="lobbyDiamondTxt" class="hud-diamond-val" data-wallet-diamonds>0</div>
            <button class="hud-plus-hitbox" style="left: 92%;" onclick="if(window.YariWallet) YariWallet.openStore('diamonds')" aria-label="زیادکردنی ئەڵماس"></button>

            <!-- ٥ دوگمە نادیارەکەی سەر کارتەکانی ناوەڕاست -->
            <!-- ١. کارتی زەرد: ٢ و ٤ یاریزان -->
            <button class="hotspot-card" style="top: 37.5%; left: 10%; width: 38.5%; height: 24%;" onclick="openLudoModeModal('24players')" aria-label="٢ و ٤ یاریزان"></button>

            <!-- ٢. کارتی مۆر تیم -->
            <button class="hotspot-card" style="top: 37.5%; right: 10%; width: 38.5%; height: 24%;" onclick="openLudoModeModal('team')" aria-label="تیپ"></button>

            <!-- ٣. کارتی سەوز: پاڵەوانێتی -->
            <button class="hotspot-card" style="top: 63.5%; left: 8.5%; width: 26%; height: 18%;" onclick="openLudoModeModal('tournament')" aria-label="پاڵەوانێتی"></button>

            <!-- ٤. کارتی شین: ژووری تایبەت -->
            <button class="hotspot-card" style="top: 63.5%; left: 37%; width: 26%; height: 18%;" onclick="openLudoModeModal('private')" aria-label="ژووری تایبەت"></button>

            <!-- ٥. کارتی سوور: ژووری VIP -->
            <button class="hotspot-card" style="top: 63.5%; right: 8.5%; width: 26%; height: 18%;" onclick="openLudoModeModal('vip')" aria-label="ژووری VIP"></button>

            <!-- ٥ دوگمە نادیارەکەی سەر شریتی خوارەوە (چالاکی، کۆگا، یاری خێرا، ژووری دەنگی، هاوڕێیان) -->
            <button class="dock-hotspot" style="left: 2%; width: 17%;" onclick="showLudoLobbyNotice('🎁 بەشی چالاکی و خەڵاتە ڕۆژانەکان بەمزووانە دەکرێتەوە!')" aria-label="چالاکی"></button>
            <button class="dock-hotspot" style="left: 20.5%; width: 17%;" onclick="showLudoLobbyNotice('🎲 کۆگای زار و پولە شاهانەکان لە قۆناغی داهاتوو دەکرێتەوە!')" aria-label="کۆگا"></button>
            <button class="dock-hotspot" style="left: 39%; width: 22%; height: 14%;" onclick="openLudoModeModal('24players')" aria-label="یاری خێرا"></button>
            <button class="dock-hotspot" style="left: 62.5%; width: 17%;" onclick="window.location.href='voice-room.html'" aria-label="ژووری دەنگی"></button>
            <button class="dock-hotspot" style="right: 2%; width: 17%;" onclick="window.location.href='index.html'" aria-label="هاوڕێیان"></button>
        </div>
    </section>

    <!-- پەنجەرەی هەڵبژاردنی مۆد لە لۆبییەکەدا -->
    <div id="ludoModeSelectModal" class="sub-modal-backdrop hidden">
        <div class="sub-modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h3 id="modeModalTitle" style="font-size:18px; font-weight:900; color:#ffd000;">٢ و ٤ یاریزان</h3>
                <button onclick="closeLudoModeModal()" style="background:rgba(255,255,255,0.12); border:none; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-weight:900;">✕</button>
            </div>
            <p id="modeModalDesc" style="font-size:12.5px; color:#cbd5e1; line-height:1.6;">شێوازی یاریکردنەکەت هەڵبژێرە بۆ چوونە ناو تەختەی لۆدۆ:</p>

            <div id="modeModalBody">
                <div class="mode-choice-grid">
                    <button class="mode-choice-btn active" onclick="startLudoFromLobby('bot')">
                        <div style="font-size:26px; margin-bottom:4px;">🤖</div>
                        <div style="font-size:13px; font-weight:900; color:#fde047;">دژی بۆتی زیرەک</div>
                        <div style="font-size:10.5px; color:#a7f3d0; margin-top:2px;">بێ بەرامبەر (1v1)</div>
                    </button>
                    <button class="mode-choice-btn" onclick="startLudoFromLobby('online')">
                        <div style="font-size:26px; margin-bottom:4px;">🌍</div>
                        <div style="font-size:13px; font-weight:900; color:#38bdf8;">ئۆنڵاین (1v1)</div>
                        <div style="font-size:10.5px; color:#a7f3d0; margin-top:2px;">لەگەڵ یاریزانان</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================================================
         تەختەی یاریکردنی لۆدۆ (120FPS PixiJS Board)
         ========================================================= -->
    <div class="game-wrapper">
        <header class="top-bar">
            <button onclick="backToLudoLobby()" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i>
                <span>لۆبیی لۆدۆ</span>
            </button>
            <button onclick="openLudoOnlineLobby()" class="online-top-btn">
                <i class="fa-solid fa-globe"></i>
                <span>یاری ئۆنڵاین</span>
            </button>
            <button class="restart-btn" onclick="initLudoGame()" title="یاری نوێ">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </header>

        <div id="ludoPanelOpp" class="player-panel">
            <div id="ludoOppBubble" class="speech-bubble"></div>
            <div class="player-info">
                <div id="ludoOppAvatar" class="avatar-box avatar-red">🤖</div>
                <div>
                    <div id="ludoOppName" class="p-name">بۆتی YariKurdi</div>
                    <div id="ludoOppCrowns" class="p-crowns">تاج: 0/4 👑</div>
                </div>
            </div>
            <div class="dice-wrap">
                <div id="ludoOppTimer" class="timer-pill">15s</div>
                <div id="ludoOppDiceBox" class="dice-container" style="border-color: #ef4444;">🎲</div>
            </div>
        </div>

        <div class="status-bar">
            <div id="ludoTurnBadge" class="turn-badge">نۆرەی تۆیە (زەردی خۆری)</div>
            <div id="ludoStatusText" class="status-text">کلیک لە زارەکە بکە 🎲</div>
        </div>

        <div class="board-frame">
            <div id="ludoBoard"></div>
        </div>

        <div id="ludoPanelMe" class="player-panel panel-active-turn" style="margin-top: 8px;">
            <div id="ludoMyBubble" class="speech-bubble"></div>
            <div class="player-info">
                <div id="ludoMyAvatar" class="avatar-box avatar-yellow">☀️</div>
                <div>
                    <div id="ludoMyName" class="p-name">تۆ (خۆری کوردستان)</div>
                    <div id="ludoMyCrowns" class="p-crowns">تاج: 0/4 👑</div>
                </div>
            </div>
            <div class="dice-wrap">
                <div id="ludoMyTimer" class="timer-pill">15s</div>
                <div id="ludoDiceBox" class="dice-container dice-ready-glow" onclick="rollLudoDice()">🎲</div>
            </div>
        </div>

        <div class="reactions-bar">
            <button class="react-btn" onclick="sendLudoQuickReaction('سڵاو هاوڕێ! 👋')">👋</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('ئافەرین! 👏')">👏</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('بەختێکی باش! 🍀')">🍀</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('ششش وەرە! 🔥')">🔥</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('ئای هاوار! 😱')">😱</button>
        </div>
    </div>

    <div id="ludoWinModal" class="win-modal-backdrop hidden">
        <div class="win-modal-card">
            <div id="ludoWinIcon" style="font-size: 54px; margin-bottom: 8px;">🏆</div>
            <h2 id="ludoWinTitle" style="font-size: 24px; font-weight: 900; color: #ffd000; margin-bottom: 6px;">پیرۆزە پاڵەوان!</h2>
            <p id="ludoWinDesc" style="font-size: 13px; color: #cbd5e1; line-height: 1.6;">هەر ٤ داشەکەت گەیاندە تاجی خۆری کوردستان و یارییەکەت بردەوە!</p>
            <button class="win-btn" onclick="closeLudoWinModal()">🔄 یارییەکی نوێ</button>
            <button class="win-btn" style="background:rgba(255,255,255,0.12); color:#fff; margin-top:8px;" onclick="closeLudoWinModal(); backToLudoLobby();">🏰 گەڕانەوە بۆ لۆبی</button>
        </div>
    </div>

    <!-- Firebase SDK + جزدان + سێرڤەری ئۆنڵاین + مەکینەی لودۆ 120FPS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="wallet-engine.js"></script>
    <script src="online-engine.js"></script>
    <script src="ludo-engine.js"></script>
    <script>
       
        function formatLobbyNum(n) {
            if (window.formatCompactNumber) return window.formatCompactNumber(n);
            n = Number(n) || 0;
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return String(n);
        }

        function updateLobbyCountersFromStorage() {
            const gEl = document.getElementById('lobbyGoldTxt');
            const dEl = document.getElementById('lobbyDiamondTxt');
            const aEl = document.getElementById('lobbyPlayerAvatar');
            const lEl = document.getElementById('lobbyPlayerLevel');

            // خوێندنەوەی ئەڤاتار و ئاست
            const cachedAvatar = localStorage.getItem('yk_player_avatar');
            const cachedLvl = parseInt(localStorage.getItem('yk_player_level') || '1', 10);
            if (aEl && cachedAvatar) aEl.src = cachedAvatar;
            if (lEl) lEl.textContent = cachedLvl;

            // خوێندنەوەی گۆڵد و ئەڵماس لە هەموو سەرچاوە ناوخۆییەکان (YariWallet یان localStorage)
            let goldVal = Number(localStorage.getItem('yk_gold') || localStorage.getItem('yk_player_gold') || 0);
            let diaVal = Number(localStorage.getItem('yk_diamonds') || localStorage.getItem('yk_player_diamonds') || 0);

            if (window.YariWallet) {
                if (typeof YariWallet.getBalance === 'function') {
                    const bal = YariWallet.getBalance();
                    if (bal) {
                        if (bal.gold !== undefined) goldVal = Number(bal.gold);
                        if (bal.diamonds !== undefined) diaVal = Number(bal.diamonds);
                    }
                }
                if (YariWallet.gold !== undefined) goldVal = Number(YariWallet.gold);
                if (YariWallet.diamonds !== undefined) diaVal = Number(YariWallet.diamonds);
            }

            if (gEl) gEl.textContent = formatLobbyNum(goldVal);
            if (dEl) dEl.textContent = formatLobbyNum(diaVal);
        }

        let lobbyFirebaseBound = false;
        function syncLobbyProfileUI() {
            updateLobbyCountersFromStorage();

            // چاوەڕێکردن تا Firebase بە تەواوی ئامادە دەبێت پاشان پەیوەستکردنی ڕاستەوخۆ بە پڕۆفایلەکەتەوە
            const tryBindFirebase = setInterval(() => {
                if (lobbyFirebaseBound) {
                    clearInterval(tryBindFirebase);
                    return;
                }

                const uid = localStorage.getItem('yk_player_uid');
                const db = window.ykDB || (window.firebase && firebase.apps && firebase.apps.length ? firebase.database() : null);

                if (db && uid) {
                    lobbyFirebaseBound = true;
                    clearInterval(tryBindFirebase);

                    db.ref(`players/${uid}`).on('value', snap => {
                        const p = snap.val();
                        if (!p) return;

                        const aEl = document.getElementById('lobbyPlayerAvatar');
                        const lEl = document.getElementById('lobbyPlayerLevel');
                        const gEl = document.getElementById('lobbyGoldTxt');
                        const dEl = document.getElementById('lobbyDiamondTxt');
                        const xpBar = document.getElementById('lobbyXpBar');

                        if (p.avatar) {
                            localStorage.setItem('yk_player_avatar', p.avatar);
                            if (aEl) aEl.src = p.avatar;
                        }
                        if (p.name) {
                            localStorage.setItem('yk_player_name', p.name);
                        }

                        const xp = Number(p.xp) || 0;
                        const level = p.level || Math.max(1, Math.floor(xp / 250) + 1);
                        localStorage.setItem('yk_player_level', String(level));
                        if (lEl) lEl.textContent = level;

                        if (xpBar) {
                            const pct = Math.min(100, Math.max(12, ((xp % 250) / 250) * 100));
                            xpBar.style.width = `${pct}%`;
                        }

                        if (p.gold !== undefined) {
                            localStorage.setItem('yk_gold', String(p.gold));
                            if (gEl) gEl.textContent = formatLobbyNum(p.gold);
                        }
                        if (p.diamonds !== undefined) {
                            localStorage.setItem('yk_diamonds', String(p.diamonds));
                            if (dEl) dEl.textContent = formatLobbyNum(p.diamonds);
                        }
                    });
                }
            }, 300);

            // نوێکردنەوەی بەردەوام لە کاتی کڕینی گۆڵد یان ئەڵماس لە ناو لۆبییەکەدا
            setInterval(updateLobbyCountersFromStorage, 1500);
        }

        function openLudoModeModal(cardType) {
            const modal = document.getElementById('ludoModeSelectModal');
            const title = document.getElementById('modeModalTitle');
            const desc = document.getElementById('modeModalDesc');
            const body = document.getElementById('modeModalBody');

            if (cardType === '24players') {
                title.textContent = '🎲 ٢ و ٤ یاریزان';
                desc.textContent = 'شێوازی یاریکردنەکەت هەڵبژێرە بۆ چوونە ناو یاری:';
                body.innerHTML = `
                    <div class="mode-choice-grid">
                        <button class="mode-choice-btn active" onclick="startLudoFromLobby('bot')">
                            <div style="font-size:26px; margin-bottom:4px;">🤖</div>
                            <div style="font-size:13px; font-weight:900; color:#fde047;">دژی بۆتی زیرەک</div>
                            <div style="font-size:10.5px; color:#a7f3d0; margin-top:2px;">بێ بەرامبەر (1v1)</div>
                        </button>
                        <button class="mode-choice-btn" onclick="startLudoFromLobby('online')">
                            <div style="font-size:26px; margin-bottom:4px;">🌍</div>
                            <div style="font-size:13px; font-weight:900; color:#38bdf8;">ئۆنڵاین (1v1)</div>
                            <div style="font-size:10.5px; color:#a7f3d0; margin-top:2px;">لەگەڵ یاریزانان</div>
                        </button>
                    </div>
                `;
            } else if (cardType === 'private') {
                title.textContent = '🔐 ژووری تایبەت';
                desc.textContent = 'ژوورێکی تایبەت دروست بکە یان کۆدی هاوڕێکەت بنووسە بۆ یاریکردن پێکەوە:';
                body.innerHTML = `
                    <button class="win-btn" onclick="startLudoFromLobby('online')">🌐 کردنەوەی ژووری هاوڕێیان (کۆد)</button>
                `;
            } else if (cardType === 'vip') {
                title.textContent = '👑 ژووری VIP';
                desc.textContent = 'مێزی شاهانەی VIP بە خەڵاتی گەورە (لە قۆناغی داهاتوو بە گرەوی تایبەت دەکرێتەوە):';
                body.innerHTML = `
                    <button class="win-btn" onclick="startLudoFromLobby('online')">👑 چوونەژوورەوە بۆ یاری VIP</button>
                `;
            } else if (cardType === 'team') {
                title.textContent = '⚔️ یاری تیپ (2v2)';
                desc.textContent = 'ئەم بەشە (٢ بەرامبەر ٢ لەگەڵ هاوڕێکەت) لە قۆناغی داهاتوودا دەخرێتە ئیش.';
                body.innerHTML = `<button class="win-btn" onclick="closeLudoModeModal()">باشە</button>`;
            } else if (cardType === 'tournament') {
                title.textContent = '🏆 پاڵەوانێتی شاهانە';
                desc.textContent = 'پاڵەوانێتی ٨ یاریزانی بۆ بردنەوەی جامی زێڕین لە قۆناغی داهاتوودا دەکرێتەوە.';
                body.innerHTML = `<button class="win-btn" onclick="closeLudoModeModal()">باشە</button>`;
            }

            modal.classList.remove('hidden');
        }

        function closeLudoModeModal() {
            document.getElementById('ludoModeSelectModal')?.classList.add('hidden');
        }

        function showLudoLobbyNotice(msg) {
            const modal = document.getElementById('ludoModeSelectModal');
            document.getElementById('modeModalTitle').textContent = '✨ یاری کوردی';
            document.getElementById('modeModalDesc').textContent = msg;
            document.getElementById('modeModalBody').innerHTML = `<button class="win-btn" onclick="closeLudoModeModal()">باشە</button>`;
            modal.classList.remove('hidden');
        }

        function startLudoFromLobby(mode) {
            closeLudoModeModal();
            document.getElementById('ludoRoyalLobby')?.classList.add('hidden-lobby');
            if (mode === 'online') {
                if (typeof openLudoOnlineLobby === 'function') openLudoOnlineLobby();
            } else {
                if (typeof initLudoGame === 'function') initLudoGame();
            }
        }

        function backToLudoLobby() {
            document.getElementById('ludoRoyalLobby')?.classList.remove('hidden-lobby');
        }

        window.addEventListener('DOMContentLoaded', () => {
            syncLobbyProfileUI();
            if (typeof initLudoGame === 'function') {
                initLudoGame();
            }
        });
    </script>
</body>
</html>
