<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری لودۆ | یاری کوردی</title>
    
    <!-- فۆنت و ئایکۆنەکان -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- کتێبخانەی Phaser 3 بۆ کارپێکردنی تەختەی یارییەکە -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <style>
        :root {
            --bg-dark: #05030f;
            --gold: #ffb800;
            --gold-gradient: linear-gradient(135deg, #ffd000 0%, #ff8800 100%);
            --card-bg: rgba(18, 12, 42, 0.85);
            --text-main: #ffffff;
            --text-muted: #a49ec8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, rgba(5, 3, 15, 0.72), rgba(5, 3, 15, 0.96)), 
                        url('images.png/background.png') no-repeat center top / cover fixed;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .game-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* بەشی سەرەوە و دوگمەی گەڕانەوە */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:active { transform: scale(0.95); }

        .game-title-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #6ee7b7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
        }

        .restart-btn {
            background: rgba(255, 184, 0, 0.15);
            border: 1px solid rgba(255, 184, 0, 0.4);
            color: var(--gold);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        /* پانێڵی یاریزانی بەرامبەر (بۆت / سوور) */
        .player-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .panel-opp { border-color: rgba(239, 68, 68, 0.45); }
        .panel-me { border-color: rgba(255, 184, 0, 0.55); box-shadow: 0 0 20px rgba(255, 184, 0, 0.15); }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
        }

        .avatar-red {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border: 1.5px solid #fca5a5;
        }

        .avatar-yellow {
            background: var(--gold-gradient);
            color: #1a0f00;
            border: 1.5px solid #fef08a;
        }

        .p-name {
            font-size: 14px;
            font-weight: 800;
        }

        .p-crowns {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* بۆکسی زارەکە */
        .dice-container {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border-radius: 14px;
            border: 2.5px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            color: #0f172a;
            transition: transform 0.15s;
            user-select: none;
        }

        .dice-container:active { transform: scale(0.9); }

        @keyframes diceSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.18); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .dice-rolling {
            animation: diceSpin 0.35s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -6px); }
        }
        .animate-bounce { animation: bounce 0.8s infinite; }

        /* نیشاندەری دۆخی یاری */
        .status-bar {
            text-align: center;
            margin: 8px 0;
        }

        .turn-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #e9d5ff;
            font-size: 12px;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 4px;
        }

        .status-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
        }

        /* چوارچێوەی تەختەی لودۆ */
        .board-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 440px;
            margin: 0 auto;
            border-radius: 22px;
            padding: 6px;
            background: linear-gradient(135deg, #ffd000, #a855f7, #00f0ff);
            box-shadow: 0 12px 35px rgba(138, 43, 226, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ludoBoard {
            width: 100%;
            height: 100%;
            border-radius: 17px;
            overflow: hidden;
            background: #120d29;
        }

        /* ئیمۆجی و کاردانەوەی خێرا */
        .reactions-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .react-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 6px 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .react-btn:active { transform: scale(0.9); background: rgba(255, 184, 0, 0.25); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- سەرەوە -->
        <header class="top-bar">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i>
                <span>سەرەکی</span>
            </a>
            <div class="game-title-badge">لودۆی شاهانە 👑</div>
            <button class="restart-btn" onclick="initLudoGame()" title="یاری نوێ">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </header>

        <!-- یاریزانی بەرامبەر (سووری ئاڵا) -->
        <div class="player-panel panel-opp">
            <div class="player-info">
                <div class="avatar-box avatar-red">🤖</div>
                <div>
                    <div id="ludoOppName" class="p-name">بۆتی YariKurdi</div>
                    <div id="ludoRedHome" class="p-crowns">تاج: 0/4 👑</div>
                </div>
            </div>
            <div id="ludoOppDiceBox" class="dice-container" style="border-color: #ef4444;">🎲</div>
        </div>

        <!-- دۆخی نۆرە -->
        <div class="status-bar">
            <div id="ludoTurnBadge" class="turn-badge">نۆرەی تۆیە (زەردی خۆری)</div>
            <div id="ludoStatusText" class="status-text">کلیک لە زارەکە بکە 🎲</div>
        </div>

        <!-- تەختەی یارییەکە -->
        <div class="board-frame">
            <div id="ludoBoard"></div>
        </div>

        <!-- یاریزانی خۆت (زەردی خۆری کوردستان) -->
        <div class="player-panel panel-me" style="margin-top: 10px;">
            <div class="player-info">
                <div class="avatar-box avatar-yellow">☀️</div>
                <div>
                    <div id="ludoMyName" class="p-name">تۆ (خۆری کوردستان)</div>
                    <div id="ludoYellowHome" class="p-crowns">تاج: 0/4 👑</div>
                </div>
            </div>
            <!-- زاری تۆ (کلیکی لێ بکە بۆ هەڵدان) -->
            <div id="ludoDiceBox" class="dice-container" onclick="rollLudoDice()">🎲</div>
        </div>

        <!-- کاردانەوەی خێرا -->
        <div class="reactions-bar">
            <button class="react-btn" onclick="sendLudoQuickReaction('سڵاو هاوڕێ! 👋')">👋</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('ئافەرین! 👏')">👏</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('بەختێکی باش! 🍀')">🍀</button>
            <button class="react-btn" onclick="sendLudoQuickReaction('ئای هاوار! 😱')">😱</button>
        </div>
    </div>

    <!-- بەستنەوەی مەکینەی لودۆکەت -->
    <script src="ludo-engine.js"></script>
    <script>
        // دەستپێکردنی خۆکاری یارییەکە کاتێک پەڕەکە دەکرێتەوە
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof initLudoGame === 'function') {
                initLudoGame();
            }
        });
    </script>
</body>
</html>
