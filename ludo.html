<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لودۆی شاهانە 120FPS | یاری کوردی</title>
    
    <!-- فۆنت، ئایکۆن و مەکینەی PixiJS v7 (120FPS) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>

    <style>
        :root {
            --bg-dark: #05030f;
            --gold: #ffb800;
            --gold-gradient: linear-gradient(135deg, #ffd000 0%, #ff8800 100%);
            --card-bg: rgba(18, 12, 42, 0.88);
            --text-main: #ffffff;
            --text-muted: #a49ec8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, rgba(5, 3, 15, 0.72), rgba(5, 3, 15, 0.96)), 
                        url('images.png/background.png') no-repeat center top / cover fixed;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        /* =========================================================
           لۆبیی شاهانەی لۆدۆ (Yari Kurdi Royal Ludo Lobby)
           ========================================================= */
        .ludo-lobby-screen {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: #0a2463;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.28s ease, transform 0.28s ease;
        }

        .ludo-lobby-screen.hidden-lobby {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.03);
        }

        .lobby-stage {
            position: relative;
            width: 100%;
            height: 100dvh;
            max-width: 480px;
            background: url('images.png/ludo-lobby-final.png') no-repeat center center / 100% 100%;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.92);
            overflow: hidden;
        }

        /* ئەڤاتاری یاریزان ڕێک لە ناو بازنە زێڕینەکە */
        .hud-avatar-overlay {
            position: absolute;
            top: 0.75%;
            left: 2.05%;
            width: 12.5%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            overflow: hidden;
            z-index: 20;
            cursor: pointer;
            border: 1.5px solid #fbbf24;
        }

        .hud-avatar-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ژمارەی ئاست ڕێک لە ناوەڕاستی ئەستێرە زەردەکە */
        .hud-level-overlay {
            position: absolute;
            top: 1.95%;
            left: 17.2%;
            width: 4.6%;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #fde047 60%, #f59e0b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            color: #451a03;
            z-index: 22;
            pointer-events: none;
        }

        /* ژمارەی گۆڵد و ئەڵماس لە ناوەڕاستی بۆکسە شینەکاندا */
        .hud-gold-val {
            position: absolute;
            top: 2.05%;
            left: 50.5%;
            width: 14%;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            z-index: 21;
            pointer-events: none;
            white-space: nowrap;
        }

        .hud-diamond-val {
            position: absolute;
            top: 2.05%;
            left: 78.2%;
            width: 13.5%;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            z-index: 21;
            pointer-events: none;
            white-space: nowrap;
        }

        /* دوگمە نادیارەکانی سەر + گۆڵد و + ئەڵماس */
        .hud-plus-hitbox {
            position: absolute;
            top: 1.5%;
            width: 6.5%;
            height: 3.8%;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 22;
        }

        /* ٥ دوگمە نادیارەکەی سەر کارتەکانی ناوەڕاستی وێنەکە */
        .hotspot-card {
            position: absolute;
            background: transparent;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .hotspot-card:active {
            transform: scale(0.95);
            box-shadow: inset 0 0 26px rgba(255, 255, 255, 0.45), 0 0 24px rgba(255, 208, 0, 0.75);
        }

        /* ٥ دوگمە نادیارەکەی سەر شریتی خوارەوەی وێنەکە */
        .dock-hotspot {
            position: absolute;
            bottom: 0.5%;
            height: 12.5%;
            background: transparent;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.12s ease;
        }

        .dock-hotspot:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

       /* =========================================================
           شاشەی هەڵبژاردنی شێوازی یاری (ludo-mode-select-clean.jpg)
           ========================================================= */
        .mode-visual-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(4, 15, 42, 0.94);
            backdrop-filter: blur(8px);
            z-index: 6000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.22s ease;
        }

        .mode-visual-stage {
            position: relative;
            width: 100%;
            height: 100dvh;
            max-width: 480px;
            background: url('images.png/ludo-mode-select-clean.jpg') no-repeat center center / 100% 100%;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.96);
            overflow: hidden;
        }

        /* دوگمەی داخستن ✕ */
        .ms-close-btn {
            position: absolute;
            top: 1.5%;
            right: 2.0%;
            width: 10.8%;
            height: 6.5%;
            background: transparent;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            z-index: 30;
        }
        .ms-close-btn:active { transform: scale(0.9); }

        /* هەڵبژاردنی دژی بۆت یان ئۆنڵاین بە ستایلی شاهانە */
        .ms-opponent-switch {
            position: absolute;
            top: 2.0%;
            left: 3.2%;
            display: inline-flex;
            background: linear-gradient(180deg, #0d2f7a 0%, #061847 100%);
            border: 2px solid #ffd000;
            border-radius: 16px;
            padding: 3px;
            gap: 3px;
            z-index: 30;
            box-shadow: 0 4px 14px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,255,255,0.25);
        }

        .ms-opp-opt {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 11px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .ms-opp-opt.active {
            background: linear-gradient(180deg, #ffe047 0%, #f59e0b 100%);
            color: #271300;
            font-weight: 900;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* کارتەکانی ٢ یاریزان و ٤ یاریزان ڕێک لەسەر چوارچێوەی وێنەکە */
        .ms-player-card {
            position: absolute;
            top: 8.6%;
            width: 38.2%;
            height: 24.2%;
            border-radius: 18px;
            background: rgba(3, 10, 32, 0.28);
            border: 2.5px solid transparent;
            cursor: pointer;
            z-index: 20;
            transition: all 0.16s ease;
        }

        .ms-player-card.selected {
            background: transparent;
            border-color: #ffe047;
            box-shadow: 0 0 24px rgba(255, 208, 0, 0.92), inset 0 0 14px rgba(255, 208, 0, 0.28);
        }

        .ms-player-card:active { transform: scale(0.97); }

        /* دوگمەی پرسیار ? */
        .ms-help-btn {
            position: absolute;
            width: 7.5%;
            height: 4.5%;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
        }
        .ms-help-btn:active { transform: scale(0.88); }

        /* ٤ دوگمەی شێوازی یاری ڕێک لەسەر دوگمەکانی ناو وێنەکە */
        .ms-style-btn {
            position: absolute;
            width: 35.6%;
            height: 7.7%;
            border-radius: 15px;
            background: rgba(3, 10, 32, 0.25);
            border: 2.5px solid transparent;
            cursor: pointer;
            z-index: 20;
            transition: all 0.15s ease;
        }

        .ms-style-btn.selected {
            background: transparent;
            border-color: #ffe047;
            box-shadow: 0 0 18px rgba(255, 208, 0, 0.85), inset 0 0 10px rgba(255, 208, 0, 0.22);
        }

        .ms-style-btn.selected::after {
            content: '✓';
            position: absolute;
            top: -9px;
            left: -7px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fde047, #d97706);
            border: 2px solid #fffbeb;
            color: #451a03;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.65);
        }

        /* زاری جادوویی (ڕێک لە ناو چوارگۆشە ڕەشەکەدا بەبێ لادان) */
        .ms-magic-toggle {
            position: absolute;
            top: 66.2%;
            left: 7.0%;
            width: 74.0%;
            height: 7.6%;
            background: transparent;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            z-index: 22;
        }

        .ms-magic-check-mark {
            position: absolute;
            top: 67.4%;
            left: 11.2%;
            width: 9.8%;
            height: 5.5%;
            border-radius: 8px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            font-size: 19px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.65);
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        /* کەم و زیادکردنی گرەو و ناوەڕاستکردنی ژمارەکە */
        .ms-bet-step-btn {
            position: absolute;
            top: 78.0%;
            width: 10.4%;
            height: 5.3%;
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 25;
        }
        .ms-bet-step-btn:active { transform: scale(0.9); }

        .ms-bet-display {
            position: absolute;
            top: 78.3%;
            left: 41.5%;
            width: 34.5%;
            height: 5.0%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-size: 21px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 0 10px rgba(255, 208, 0, 0.4);
            z-index: 20;
            pointer-events: none;
        }

        /* دوگمەی دەستپێکردن */
        .ms-start-btn {
            position: absolute;
            top: 86.5%;
            left: 15.0%;
            width: 70.0%;
            height: 9.8%;
            background: transparent;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            z-index: 25;
            transition: transform 0.14s ease;
        }
        .ms-start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 28px rgba(255, 208, 0, 0.85);
        }
        /* پەنجەرەی ئاگادارکردنەوە و ڕوونکردنەوەی بچووک */
        .sub-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(3, 18, 45, 0.84);
            backdrop-filter: blur(10px);
            z-index: 7000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .sub-modal-card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(160deg, #102a6b 0%, #071336 100%);
            border: 2px solid #ffd000;
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* =========================================================
           ستایلی تەختەی یاریکردن (Game Wrapper)
           ========================================================= */
        .game-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100dvh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.95); }

        .online-top-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: 1.5px solid #a7f3d0;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transition: transform 0.15s;
        }

        .online-top-btn:active { transform: scale(0.95); }

        .restart-btn {
            background: rgba(255, 184, 0, 0.15);
            border: 1px solid rgba(255, 184, 0, 0.45);
            color: var(--gold);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .restart-btn:active { transform: scale(0.92); }

        .player-panel {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1.8px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .panel-active-turn {
            border-color: #fde047 !important;
            box-shadow: 0 0 24px rgba(250, 204, 21, 0.35) !important;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .avatar-box {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: 900;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-red {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border: 2px solid #fca5a5;
            color: #fff;
        }

        .avatar-yellow {
            background: var(--gold-gradient);
            color: #1a0f00;
            border: 2px solid #fef08a;
        }

        .p-name {
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
        }

        .p-crowns {
            font-size: 12px;
            font-weight: 700;
            color: #fde047;
            margin-top: 2px;
        }

        .speech-bubble {
            position: absolute;
            left: 78px;
            top: -14px;
            background: #ffffff;
            color: #0f172a;
            font-size: 12px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.55);
            border: 2px solid var(--gold);
            opacity: 0;
            transform: translateY(8px) scale(0.85);
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 40;
            white-space: nowrap;
        }

        .speech-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .dice-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-pill {
            font-family: monospace;
            font-size: 13px;
            font-weight: 900;
            color: #fde047;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 4px 8px;
            border-radius: 10px;
            min-width: 36px;
            text-align: center;
        }

        .dice-container {
            position: relative;
            width: 54px;
            height: 54px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border-radius: 16px;
            border: 2.5px solid var(--gold);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55), inset 0 2px 4px rgba(255,255,255,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            color: #0f172a;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .dice-container:active { transform: scale(0.9); }

        .dice-ready-glow {
            box-shadow: 0 0 22px rgba(250, 204, 21, 0.9), 0 6px 16px rgba(0, 0, 0, 0.55) !important;
        }

        @keyframes diceSpin3D {
            0%   { transform: rotate(0deg) scale(1); }
            35%  { transform: rotate(140deg) scale(1.22); }
            70%  { transform: rotate(260deg) scale(1.12); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .dice-rolling {
            animation: diceSpin3D 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes bounceArrow {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -7px); }
        }
        .animate-bounce { animation: bounceArrow 0.75s infinite; }

        .status-bar {
            text-align: center;
            margin: 5px 0;
        }

        .turn-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.55);
            color: #f3e8ff;
            font-size: 12px;
            font-weight: 800;
            padding: 3px 14px;
            border-radius: 20px;
            margin-bottom: 3px;
        }

        .status-text {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold);
        }

        .board-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 444px;
            margin: 0 auto;
            border-radius: 22px;
            padding: 6px;
            background: linear-gradient(135deg, #ffd000, #a855f7, #00f0ff);
            box-shadow: 0 14px 38px rgba(138, 43, 226, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ludoBoard {
            width: 100%;
            height: 100%;
            border-radius: 17px;
            overflow: hidden;
            background: #fffdf7;
            touch-action: none;
            position: relative;
        }

        #ludoBoard canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .reactions-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .react-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }

        .react-btn:active {
            transform: scale(0.88);
            background: rgba(255, 184, 0, 0.28);
        }

        .win-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 3, 15, 0.86);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .win-modal-card {
            width: 100%;
            max-width: 360px;
            background: #160f36;
            border: 2px solid var(--gold);
            border-radius: 26px;
            padding: 26px 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85);
        }

        .win-btn {
            background: var(--gold-gradient);
            color: #1a0f00;
            font-weight: 900;
            font-size: 15px;
            border: none;
            border-radius: 16px;
            padding: 13px;
            width: 100%;
            cursor: pointer;
            margin-top: 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- =========================================================
         قۆناغی ١: لۆبیی شاهانەی لۆدۆ (Yari Kurdi Royal Lobby)
         ========================================================= -->
    <section id="ludoRoyalLobby" class="ludo-lobby-screen">
        <div class="lobby-stage">

    <!-- Firebase SDK + جزدان + سێرڤەری ئۆنڵاین + مەکینەی لودۆ 120FPS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="wallet-engine.js"></script>
    <script src="online-engine.js"></script>
    <script src="ludo-engine.js"></script>
    <script>
        /* =========================================================
           بەڕێوەبردنی هەڵبژاردنەکانی شاشەی (ludo-mode-select.jpg)
           ========================================================= */
        const LUDO_BET_LEVELS = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];
        window.ludoMatchConfig = {
            opponent: 'bot',     // 'bot' یان 'online'
            players: 2,          // 2 یان 4
            style: 'classic',    // 'classic', 'arrow', 'quick', 'master'
            magicDice: true,
            betIndex: 2          // 500
        };

        function openVisualModeSelector(defaultBet) {
            if (defaultBet) {
                const idx = LUDO_BET_LEVELS.indexOf(defaultBet);
                if (idx !== -1) window.ludoMatchConfig.betIndex = idx;
            }
            updateVisualModeUI();
            document.getElementById('ludoVisualModeScreen')?.classList.remove('hidden');
        }

        function closeVisualModeSelector() {
            document.getElementById('ludoVisualModeScreen')?.classList.add('hidden');
        }

        function setVisualOpponent(type) {
            window.ludoMatchConfig.opponent = type;
            updateVisualModeUI();
        }

        function selectVisualPlayers(count) {
            window.ludoMatchConfig.players = count;
            updateVisualModeUI();
        }

        function selectVisualStyle(styleKey) {
            window.ludoMatchConfig.style = styleKey;
            updateVisualModeUI();
        }

        function toggleVisualMagicDice() {
            window.ludoMatchConfig.magicDice = !window.ludoMatchConfig.magicDice;
            updateVisualModeUI();
        }

        function changeVisualBet(dir) {
            let next = window.ludoMatchConfig.betIndex + dir;
            if (next < 0) next = 0;
            if (next >= LUDO_BET_LEVELS.length) next = LUDO_BET_LEVELS.length - 1;
            window.ludoMatchConfig.betIndex = next;
            updateVisualModeUI();
        }

        function updateVisualModeUI() {
            const cfg = window.ludoMatchConfig;

            // بۆت یان ئۆنڵاین
            document.getElementById('msOppBot')?.classList.toggle('active', cfg.opponent === 'bot');
            document.getElementById('msOppOnline')?.classList.toggle('active', cfg.opponent === 'online');

            // ٢ یاریزان یان ٤ یاریزان
            document.getElementById('msCard2P')?.classList.toggle('selected', cfg.players === 2);
            document.getElementById('msCard4P')?.classList.toggle('selected', cfg.players === 4);

            // شێوازی یاری
            document.getElementById('msStyleClassic')?.classList.toggle('selected', cfg.style === 'classic');
            document.getElementById('msStyleArrow')?.classList.toggle('selected', cfg.style === 'arrow');
            document.getElementById('msStyleQuick')?.classList.toggle('selected', cfg.style === 'quick');
            document.getElementById('msStyleMaster')?.classList.toggle('selected', cfg.style === 'master');

            // زاری جادوویی
           const checkMark = document.getElementById('msMagicCheckMark');
if (checkMark) {
    checkMark.classList.toggle('hidden', !cfg.magicDice);
}

            // بڕی گرەو
            const betVal = LUDO_BET_LEVELS[cfg.betIndex] || 500;
            const betEl = document.getElementById('msBetAmountTxt');
            if (betEl) betEl.textContent = betVal.toLocaleString('en-US');
        }

        function launchVisualSelectedMatch() {
            const cfg = window.ludoMatchConfig;
            const betVal = LUDO_BET_LEVELS[cfg.betIndex] || 500;
            localStorage.setItem('yk_ludo_config', JSON.stringify({
                ...cfg,
                bet: betVal
            }));

            closeVisualModeSelector();
            document.getElementById('ludoRoyalLobby')?.classList.add('hidden-lobby');

            if (cfg.opponent === 'online') {
                if (typeof openLudoOnlineLobby === 'function') openLudoOnlineLobby();
            } else {
                if (typeof initLudoGame === 'function') initLudoGame();
            }
        }

        function startDirectOnlineMode() {
            document.getElementById('ludoRoyalLobby')?.classList.add('hidden-lobby');
            if (typeof openLudoOnlineLobby === 'function') openLudoOnlineLobby();
        }

        function openLudoInfoModal(title, msg) {
            document.getElementById('modeModalTitle').textContent = title;
            document.getElementById('modeModalDesc').textContent = msg;
            document.getElementById('ludoModeSelectModal')?.classList.remove('hidden');
        }

        function closeLudoModeModal() {
            document.getElementById('ludoModeSelectModal')?.classList.add('hidden');
        }

        function backToLudoLobby() {
            if (typeof ludoTurnInterval !== 'undefined') clearInterval(ludoTurnInterval);
            if (typeof ludoState !== 'undefined') ludoState.winner = 'paused';
            document.getElementById('ludoRoyalLobby')?.classList.remove('hidden-lobby');
        }

        /* =========================================================
           هاوکاتکردنی پڕۆفایل، گۆڵد و ئەڵماس لە سەرەوەی لۆبی
           ========================================================= */
        function formatLobbyNum(n) {
            if (window.formatCompactNumber) return window.formatCompactNumber(n);
            n = Number(n) || 0;
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return String(n);
        }

        function updateLobbyCountersFromStorage() {
            const gEl = document.getElementById('lobbyGoldTxt');
            const dEl = document.getElementById('lobbyDiamondTxt');
            const aEl = document.getElementById('lobbyPlayerAvatar');
            const lEl = document.getElementById('lobbyPlayerLevel');

            const cachedAvatar = localStorage.getItem('yk_player_avatar');
            const cachedLvl = parseInt(localStorage.getItem('yk_player_level') || '1', 10);
            if (aEl && cachedAvatar) aEl.src = cachedAvatar;
            if (lEl) lEl.textContent = cachedLvl;

            let goldVal = Number(localStorage.getItem('yk_gold') || localStorage.getItem('yk_player_gold') || 0);
            let diaVal = Number(localStorage.getItem('yk_diamonds') || localStorage.getItem('yk_player_diamonds') || 0);

            if (window.YariWallet) {
                if (typeof YariWallet.getBalance === 'function') {
                    const bal = YariWallet.getBalance();
                    if (bal) {
                        if (bal.gold !== undefined) goldVal = Number(bal.gold);
                        if (bal.diamonds !== undefined) diaVal = Number(bal.diamonds);
                    }
                }
                if (YariWallet.gold !== undefined) goldVal = Number(YariWallet.gold);
                if (YariWallet.diamonds !== undefined) diaVal = Number(YariWallet.diamonds);
            }

            if (gEl) gEl.textContent = formatLobbyNum(goldVal);
            if (dEl) dEl.textContent = formatLobbyNum(diaVal);
        }

        let lobbyFirebaseBound = false;
        function syncLobbyProfileUI() {
            updateLobbyCountersFromStorage();

            const tryBindFirebase = setInterval(() => {
                if (lobbyFirebaseBound) {
                    clearInterval(tryBindFirebase);
                    return;
                }

                const uid = localStorage.getItem('yk_player_uid');
                const db = window.ykDB || (window.firebase && firebase.apps && firebase.apps.length ? firebase.database() : null);

                if (db && uid) {
                    lobbyFirebaseBound = true;
                    clearInterval(tryBindFirebase);

                    db.ref(`players/${uid}`).on('value', snap => {
                        const p = snap.val();
                        if (!p) return;

                        const aEl = document.getElementById('lobbyPlayerAvatar');
                        const lEl = document.getElementById('lobbyPlayerLevel');
                        const gEl = document.getElementById('lobbyGoldTxt');
                        const dEl = document.getElementById('lobbyDiamondTxt');

                        if (p.avatar) {
                            localStorage.setItem('yk_player_avatar', p.avatar);
                            if (aEl) aEl.src = p.avatar;
                        }
                        if (p.name) {
                            localStorage.setItem('yk_player_name', p.name);
                        }

                        const xp = Number(p.xp) || 0;
                        const level = p.level || Math.max(1, Math.floor(xp / 250) + 1);
                        localStorage.setItem('yk_player_level', String(level));
                        if (lEl) lEl.textContent = level;

                        if (p.gold !== undefined) {
                            localStorage.setItem('yk_gold', String(p.gold));
                            if (gEl) gEl.textContent = formatLobbyNum(p.gold);
                        }
                        if (p.diamonds !== undefined) {
                            localStorage.setItem('yk_diamonds', String(p.diamonds));
                            if (dEl) dEl.textContent = formatLobbyNum(p.diamonds);
                        }
                    });
                }
            }, 300);

            setInterval(updateLobbyCountersFromStorage, 1500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            syncLobbyProfileUI();
            updateVisualModeUI();
        });
    </script>
</body>
